services:
  api:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
    env_file:
      - .env # This will load GROQ_API_KEY
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3003:3003"
    restart: unless-stopped
    depends_on:
      - api

  admin-frontend:
    build: ./admin-frontend
    ports:
      - "3005:3005"
    restart: unless-stopped
    depends_on:
      - api
